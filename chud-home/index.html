<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chud Home &mdash; Play anything. Browse anything.</title>
  <meta name="description" content="Chud Home is your launcher for unblocked games and a fully proxied browser, right in your tab.">
  <meta property="og:title" content="Chud Home">
  <meta property="og:description" content="Play anything. Browse anything.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/favicon.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script>window.__WISP_HOST='algebraforhighschool.a.onjrnm.co.uk';window.__AI_URL='';</script>
</head>
<body>

  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <header class="nav">
    <a class="nav-brand" href="#home" onclick="switchView('home');return false;">
      <img src="/favicon.png" alt="" width="30" height="30">
      <span>CHUD <em>HOME</em></span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <button class="pill" onclick="switchView('home')">Home</button>
      <button class="pill" onclick="switchView('games')">Games</button>
      <button class="pill" onclick="openBrowser('https://www.google.com')">Browser</button>
    </nav>
  </header>

  <main>

    <!-- HOME -->
    <section id="view-home" class="view">
      <div class="hero">
        <p class="hero-kicker">THE HOME OF CHUD</p>
        <h1 class="hero-title">Play anything. <span>Browse anything.</span></h1>
        <p class="hero-sub">Every game you could want plus a fully proxied browser &mdash; nothing installed, nothing blocked.</p>

        <form class="search" id="hero-search" onsubmit="heroGo(event)">
          <span class="search-ico" aria-hidden="true">&#9906;</span>
          <input id="hero-input" type="text" placeholder="Type a game name or paste a URL&hellip;" autocomplete="off" spellcheck="false">
          <button type="submit" class="search-go">Go</button>
        </form>

        <div class="hero-actions">
          <button class="chip" onclick="openBrowser('https://www.google.com')">Open Browser</button>
          <button class="chip" onclick="randomGame()">Random Game</button>
          <button class="chip" onclick="switchView('games')">All Games</button>
        </div>

        <div class="stat-row" id="stat-row"></div>
      </div>

      <div class="rail-head">
        <h2>Featured</h2>
        <button class="chip chip-sm" onclick="switchView('games')">See all &rarr;</button>
      </div>
      <div class="rail" id="featured-rail"></div>
    </section>

    <!-- GAMES -->
    <section id="view-games" class="view" hidden>
      <div class="subbar">
        <h2 class="subbar-title">Game Library <span id="game-count"></span></h2>
        <div class="subbar-controls">
          <div class="search search-sm">
            <span class="search-ico" aria-hidden="true">&#9906;</span>
            <input id="game-search" type="text" placeholder="Search games&hellip;" oninput="renderGames()" autocomplete="off" spellcheck="false">
          </div>
          <select id="sort-select" class="sort" onchange="renderGames()">
            <option value="featured">Featured</option>
            <option value="az">A&ndash;Z</option>
            <option value="za">Z&ndash;A</option>
            <option value="new">Newest</option>
          </select>
          <button class="chip" onclick="shuffleGames()">&#9881; Shuffle</button>
        </div>
      </div>
      <div class="grid" id="game-grid"></div>
      <p class="empty" id="empty-state" hidden>No games match that search.</p>
    </section>

    <!-- BROWSER -->
    <section id="view-browser" class="view" hidden>
      <div class="browser-bar">
        <button class="bbtn" id="browser-exit" title="Back to Chud Home" onclick="closeBrowser()">&#8592; Home</button>
        <form class="search search-browser" onsubmit="browserGo(event)">
          <span class="search-ico" aria-hidden="true">&#128269;</span>
          <input id="urlbar" type="text" placeholder="Search or enter a URL&hellip;" autocomplete="off" spellcheck="false">
          <button type="submit" class="search-go">Browse</button>
        </form>
        <button class="bbtn" title="Reload" onclick="proxyReload()">&#8635;</button>
        <button class="bbtn" title="Open in new tab" onclick="proxyNewTab()">&#8599;</button>
      </div>
      <iframe id="proxy-frame" title="Browsed content"></iframe>
    </section>

  </main>

  <footer class="foot">
    <span>Chud Home &mdash; built for the hallway crowd.</span>
  </footer>

  <div id="loading" class="loading" hidden>
    <div class="loading-card">
      <div class="loader" aria-hidden="true"></div>
      <p>Firing up the proxy&hellip;</p>
      <small id="loading-target"></small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/Cronusz3n96/stolenstuff@main/noah-js-folder/games.js"></script>
  <script>
    (function () {
      var BASE = 'https://cdn.jsdelivr.net/gh/Cronusz3n96/stolenstuff@main/';
      function resolve(u) {
        if (!u) return u;
        u = String(u).trim();
        if (/^https?:\/\//i.test(u)) return u;
        return BASE + u.replace(/^\//, '');
      }
      if (typeof games !== 'undefined' && Array.isArray(games)) {
        games.forEach(function (g) {
          if (g.url) g.url = resolve(g.url);
          if (g.image) g.image = resolve(g.image);
        });
      }
    })();
  </script>
  <script src="/gnmath-games.js"></script>
  <script src="/bootstrap-init.js"></script>
  <script src="/app.js"></script>
</body>
</html>
