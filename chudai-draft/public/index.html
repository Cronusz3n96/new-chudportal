<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChudAI Draft</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0a0a0c;
    color: #e6e6e6;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid #2a2a2e;
    background: #111114;
    flex-shrink: 0;
  }
  header .title { letter-spacing: 2px; font-weight: bold; color: #8ab4ff; }
  header .model { font-size: 0.7rem; color: #888; }
  #msgs {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 0.9rem;
  }
  .user {
    align-self: flex-end;
    background: #1e3a5f;
    border: 1px solid #34598c;
    color: #d6e6ff;
  }
  .bot {
    align-self: flex-start;
    background: #16161a;
    border: 1px solid #2f2f35;
    color: #d8d8d8;
  }
  .err { color: #ff6b6b; }
  #bar {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid #2a2a2e;
    background: #111114;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: #0d0d10;
    color: #e6e6e6;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }
  #input:focus { border-color: #8ab4ff; }
  #send {
    background: #1e3a5f;
    color: #d6e6ff;
    border: 1px solid #34598c;
    border-radius: 10px;
    padding: 0 20px;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: wait; }
  #status { font-size: 0.7rem; color: #666; text-align: center; padding: 4px; flex-shrink: 0; }
</style>
</head>
<body>
  <header>
    <div class="title">CHUDAI &mdash; DRAFT</div>
    <div class="model" id="modelTag">cerebras (loading)</div>
  </header>

  <main id="msgs"></main>
  <div id="status"></div>

  <div id="bar">
    <input id="input" placeholder="Ask anything..." autocomplete="off" autofocus>
    <button id="send">SEND</button>
  </div>

<script>
'use strict';
const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const send = document.getElementById('send');
const status = document.getElementById('status');
const modelTag = document.getElementById('modelTag');

let history = [];
let busy = false;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function setBusy(b) {
  busy = b;
  send.disabled = b;
  input.disabled = b;
  status.textContent = b ? 'thinking on cerebras...' : '';
  if (!b) input.focus();
}

async function ask(text) {
  addMsg(text, 'user');
  setBusy(true);
  history.push({ role: 'user', content: text });
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    addMsg(data.reply, 'bot');
    history.push({ role: 'assistant', content: data.reply });
    if (modelTag.textContent.indexOf('loading') !== -1) modelTag.textContent = 'cerebras · ' + data.model;
  } catch (err) {
    addMsg('error: ' + err.message, 'err');
    history.pop();
  } finally {
    setBusy(false);
  }
}

send.addEventListener('click', () => {
  const t = input.value.trim();
  if (!t || busy) return;
  input.value = '';
  ask(t);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send.click();
});
</script>
</body>
</html>
